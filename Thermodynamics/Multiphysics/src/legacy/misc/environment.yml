name: physicsnemo_v4
channels:
  # CUDA 12.1 toolkit（必须用此频道，供 physicsnemo-sym 编译使用）
  - nvidia/label/cuda-12.1.0
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # ── 系统编译环境 (强制降级至 GCC 12 以彻底解决 CUDA 冲突) ──
  - gcc_linux-64=12
  - gxx_linux-64=12
  # ── CUDA 12.1 编译工具链 ──
  - cuda-toolkit=12.1
  # ── 科学计算与可视化 ──
  - numpy=1.26.4
  - scipy=1.11.4
  - pandas=2.2.2
  - matplotlib=3.8.4
  - scikit-learn=1.5.1
  - tqdm=4.66.4
  - imageio=2.34.1
  - pillow=10.4.0
  - pip
  - pip:
    # 使用 --extra-index-url 确保既能从 PyTorch 下载，也能从 PyPI 补全包
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.4.0
    - torchvision==0.19.0
    - torchaudio==2.4.0
    # ── NVIDIA PhysicsNeMo 基础包 ──
    - nvidia-physicsnemo
    # ── Cython（physicsnemo-sym 源码编译前置依赖）──
    - Cython
    # ── PhysicsNeMo Sym 编译安装请通过运行 bash setup.sh 完成 ──
